version: 1
indices:
  training:
    include:
      - '/**'
    exclude:
      - '/de/**'
      - '/de'
      - '/profiles/**'
      - '/drafts/**'  
    properties:
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content') 
    filter:
      - name: robots
        op: notContains
        value: noindex    
    properties:        
        # filter: value ~= "(?i)^index$|^index, follow$|^index,follow$"
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT") 
           
    target: s3://training-edsproject.json

